# Read-only staging identity verification. Manual dispatch only.
#
# Targets the designated staging Supabase project and runs the read-only
# ProbeState audit. The project reference is never written here: it is read from
# the environment variable POS_STAGING_PROJECT_REF so this file cannot designate a
# project by itself, and the shared staging-target validator rejects known
# non-staging projects at run time.
#
# This workflow exists so an independent
# reviewer can confirm the staging database identity WITHOUT ever running any
# provisioning, role creation, grant changes, or migration application.
#
# Separation from probe-staging.yml:
#   probe-staging.yml          → can apply role/grant DDL with -Apply
#   probe-staging-identity.yml → read-only verification only, no apply path
#
# Both staging workflows consume the SAME connection contract:
#   POS_STAGING_PROJECT_REF, POS_STAGING_POOLER_HOST,
#   POS_STAGING_DB_ROOT_CERT (path materialized on this runner) and
#   POS_STAGING_DB_ROOT_CERT_SHA256.
#
# Environment requirements (owner-configured on pos-staging-admin):
#   vars:
#     POS_STAGING_PROJECT_REF         = <designated staging project reference>
#     POS_STAGING_POOLER_HOST         = the approved pooler hostname
#     POS_STAGING_DB_ROOT_CERT_B64    = base64 of the staged CA (PEM)
#     POS_STAGING_DB_ROOT_CERT_SHA256 = SHA-256 of that CA's DER encoding
#     PROBE_ADMIN_USER                = postgres.<same reference>
#   secrets (never logged, never artifacted):
#     PROBE_ADMIN_PASS         = admin password for that role; the workflow maps it
#                                into ProbeState as CHECK_PASS, so no separate
#                                CHECK_PASS secret is required
#
# The CA is materialized by server/tools/materialize-staging-root-cert.sh into a
# 0600 file under $RUNNER_TEMP, verified against the independent fingerprint, and
# exposed to the Java probe only as a path. It is removed by an `if: always()`
# step, so nothing survives the run. Hosted runners are ephemeral: a certificate
# path stored in configuration can never be assumed to exist, and a missing value
# fails the job before the probe starts rather than falling back to system trust.
#
# Evidence policy: the probe's full output is database inventory and is treated as
# sensitive. It is written to a scratch file that is NEVER uploaded. Only the
# allowlisted summary below becomes the artifact and the workflow log.
#
# The summary is derived from the probe's own output wherever it describes the
# probe: `read_only_transaction` is copied from the probe's server-side
# confirmation line and falls back to `not_confirmed` when that line is absent.

name: probe-staging-identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    environment: pos-staging-admin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node for the staging target validator
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The runner is ephemeral, so the staged CA is written here, verified here
      # and removed at the end of the job. Only the resulting path is exported.
      - name: Materialize staged root certificate
        shell: bash
        env:
          POS_STAGING_DB_ROOT_CERT_B64: ${{ vars.POS_STAGING_DB_ROOT_CERT_B64 }}
          POS_STAGING_DB_ROOT_CERT_SHA256: ${{ vars.POS_STAGING_DB_ROOT_CERT_SHA256 }}
        run: bash server/tools/materialize-staging-root-cert.sh

      - name: Validate staging target reference
        shell: bash
        env:
          POS_STAGING_PROJECT_REF: ${{ vars.POS_STAGING_PROJECT_REF }}
          # The environment calls this PROBE_ADMIN_USER; the validator module reads
          # POS_STAGING_ADMIN_USER. Map it rather than renaming the stored variable.
          POS_STAGING_ADMIN_USER: ${{ vars.PROBE_ADMIN_USER }}
          # Shared staging connection contract, consumed by both ProbeState (JDBC)
          # and probe-readonly.ps1 (PowerShell). Both paths validate these values
          # against the same staging contract before any connection is made.
          # POS_STAGING_DB_ROOT_CERT arrives from the materialization step above.
          POS_STAGING_POOLER_HOST: ${{ vars.POS_STAGING_POOLER_HOST }}
          POS_STAGING_DB_ROOT_CERT_SHA256: ${{ vars.POS_STAGING_DB_ROOT_CERT_SHA256 }}
        run: |
          set -euo pipefail

          # The authoritative staging identity rules live in
          # src/config/staging-target.ts: it rejects a missing or malformed
          # reference, any reference on the known non-staging denylist
          # (development and the former verification project), a missing or
          # malformed administrator username, and a username whose project suffix
          # disagrees with the designated reference.
          #
          # Running that module here — rather than re-implementing the checks in
          # this file — means the Actions runtime path enforces exactly the rules
          # the repository already tests, with no per-workflow copy to drift.
          #
          # Fail-closed: a non-zero exit stops the job before any connection is
          # opened. Node runs the TypeScript directly via type stripping.
          node scripts/check-staging-target.ts

          REF="${POS_STAGING_PROJECT_REF}"
          echo "Target project reference: $REF"
          echo "Username suffix validation: PASS"
          echo "MATCHED_REF=$REF" >> "$GITHUB_ENV"

      - name: Run read-only staging identity probe
        shell: bash
        env:
          POS_STAGING_PROJECT_REF: ${{ vars.POS_STAGING_PROJECT_REF }}
          POS_STAGING_POOLER_HOST: ${{ vars.POS_STAGING_POOLER_HOST }}
          POS_STAGING_DB_ROOT_CERT_SHA256: ${{ vars.POS_STAGING_DB_ROOT_CERT_SHA256 }}
          CHECK_URL: jdbc:postgresql://${{ vars.POS_STAGING_POOLER_HOST }}:5432/postgres
          CHECK_USER: ${{ vars.PROBE_ADMIN_USER }}
          CHECK_PASS: ${{ secrets.PROBE_ADMIN_PASS }}
          PROBE_CONFIRM: "yes"
        run: |
          # GitHub starts every bash `run:` with `bash --noprofile --norc -eo
          # pipefail {0}`. `set -uo pipefail` below does NOT remove that -e, so a
          # bare failing command would abort this step instantly — which is how
          # run 41560464733 died on exit 126 before any evidence was written.
          #
          # Errexit therefore stays ENABLED (we do not weaken it with `set +e`).
          # Instead the probe runs as the CONDITION of an if-statement, which
          # errexit never triggers on, so its failure is captured into STATUS and
          # the sanitized evidence can be generated before the step decides its
          # own exit status.
          set -uo pipefail

          cd server

          # ProbeState reads CHECK_URL / CHECK_USER / CHECK_PASS from the environment
          # only. No credential is passed on the command line, so nothing secret
          # appears in a process listing.
          #
          # ProbeState is read-only: it refuses an unset CHECK_URL, refuses without
          # PROBE_CONFIRM=yes, refuses hosts containing "prod", refuses any target
          # that is neither the configured pooler nor a loopback test database,
          # verifies that POS_STAGING_PROJECT_REF matches CHECK_USER, opens a
          # read-only transaction, and only ever issues SELECTs against catalogs
          # and views. It never invokes probe-readonly.ps1 and has no provisioning
          # path.
          if ./gradlew -q execProbeState > probe-raw.txt 2>&1; then
            STATUS=0
          else
            STATUS=$?
          fi

          # Every evidence rule lives in tools/probe-evidence.sh so it can be
          # tested without GitHub. The script reads the raw output once and
          # requires, independently: the probe's exit status is 0; EXACTLY ONE
          # `read_only_transaction=server_confirmed` line and no other
          # read_only_transaction line (enforced, on, off, missing, duplicates and
          # unexpected values are all not_confirmed); and EXACTLY ONE
          # `probe_status=ok` line. A previous version accepted `enforced` and
          # rewrote it to `server_confirmed`, which published confirmation for a
          # protection the binary never checked.
          bash tools/probe-evidence.sh probe-raw.txt probe-evidence.txt "$STATUS" "${MATCHED_REF:-unset}"

          # The full probe output is inventory; it must never be published.
          # Deleted BEFORE this step can exit, on both the success and the
          # failure path below.
          rm -f probe-raw.txt

          # The step's exit status mirrors the probe's, so a failed connection
          # can never be reported as a green workflow.
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Read-only identity probe failed (exit ${STATUS}). Sanitized evidence: server/probe-evidence.txt"
            exit "$STATUS"
          fi

      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-staging-identity-evidence
          # Only the allowlisted summary is uploaded. The raw probe output is deleted
          # in the previous step and is never an artifact.
          path: server/probe-evidence.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Remove staged certificate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "${RUNNER_TEMP:-/tmp}/staging-root-ca.pem"
